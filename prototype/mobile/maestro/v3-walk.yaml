# Walks Home, Needs you, threads, Ask the CEO and the pulse on the fake
# company, and proves scroll-to-minimize on every tab. Work, Company and the
# pages under them are v3-walk-work-company.yaml. Screenshots are named
# <theme>-NN-name under the test output dir.
#
#   prototype/mobile/maestro/walk.sh <udid> [light|dark]
appId: com.nuncio.lilos.mobile
---
- launchApp
# A fresh company every run: the walk approves and denies real asks.
- openLink: lilos://preview?reset=1&open=home
- tapOn:
    text: "Allow"
    optional: true
- assertVisible: "Oscar Co"
- waitForAnimationToEnd:
    timeout: 1500
- takeScreenshot: ${THEME}-01-home

# Home: the tile opens Needs you.
- assertVisible: "3 needs you"
- tapOn: "3 needs you"
- assertVisible: "1 of 3"
- waitForAnimationToEnd:
    timeout: 1500
- takeScreenshot: ${THEME}-02-needs-card

# Details: the full reasons, cost and fallback behind the card.
- tapOn: "Details"
- assertVisible: "If you do nothing"
- waitForAnimationToEnd:
    timeout: 1500
- takeScreenshot: ${THEME}-03-needs-details
- tapOn: "Close details"

# Approve by swipe: the card flies off, the next one is "1 of 2".
- swipe:
    from:
      id: ask-card
    direction: RIGHT
    duration: 300
- assertVisible: "1 of 2"
- assertNotVisible: "Approve $40 for the Meta Ads test"
- waitForAnimationToEnd:
    timeout: 1500
- takeScreenshot: ${THEME}-04-needs-question

# Answer a question ask: it shows its choices, not a swipe.
- tapOn: "Keep “QRit”"
- assertVisible: "1 of 1"
- waitForAnimationToEnd:
    timeout: 1500
- takeScreenshot: ${THEME}-05-needs-plan
- runFlow:
    file: scroll-proof.yaml
    env:
      NAME: needs

# Reject by button.
- tapOn: "Reject plan"
- assertVisible: "All clear"
- waitForAnimationToEnd:
    timeout: 1500
- takeScreenshot: ${THEME}-06-needs-empty

# A new ask arrives: Home shows it as the one ask that matters; approve it
# there, by button, and the count moves.
- openLink: lilos://preview?push=ask&open=home
- assertVisible: "1 needs you"
- waitForAnimationToEnd:
    timeout: 1500
- takeScreenshot: ${THEME}-07-home-new-ask
- tapOn: "Approve"
- assertVisible: "0 needs you"
- waitForAnimationToEnd:
    timeout: 1500
- takeScreenshot: ${THEME}-08-home-after
- runFlow:
    file: scroll-proof.yaml
    env:
      NAME: home

# A second one, denied on the Needs you tab by button.
- openLink: lilos://preview?push=ask&open=needs
- assertVisible: "1 of 1"
- tapOn: "Deny"
- assertVisible: "All clear"

# Results to look at opens the thread behind them.
- tapOn: "Merge PR #66.*"
- assertVisible:
    id: thread-composer-input
- waitForAnimationToEnd:
    timeout: 1500
- takeScreenshot: ${THEME}-09-thread-result

# A thread: send a message and watch the scripted reply stream in. Threads
# cover the tab bar (the composer owns the bottom).
- openLink: lilos://preview?open=thread:t-chat-relay
- assertVisible:
    id: thread-composer-input
- waitForAnimationToEnd:
    timeout: 1500
- takeScreenshot: ${THEME}-10-thread-chat
- tapOn:
    id: thread-composer-input
- inputText: "Why is ac-544 flaky?"
- tapOn: "Send"
- assertVisible: "Why is ac-544 flaky?"
- waitForAnimationToEnd:
    timeout: 1500
- takeScreenshot: ${THEME}-11-thread-working
- extendedWaitUntil:
    visible: "Worked.*"
    timeout: 60000
- waitForAnimationToEnd:
    timeout: 1500
- takeScreenshot: ${THEME}-12-thread-reply

# The plan ask: its thread carries the plan (read from the same place as the
# Mac's), and Reject / Approve plan decide it right there.
- openLink: lilos://preview?reset=1&open=thread:t-chat-sidebar
- assertVisible: "Read the saved width synchronously, before the first render"
- waitForAnimationToEnd:
    timeout: 1500
- takeScreenshot: ${THEME}-13-thread-plan
- tapOn: "Reject plan"
- assertVisible: "Rejected"
- waitForAnimationToEnd:
    timeout: 1500
- takeScreenshot: ${THEME}-14-thread-plan-rejected
- openLink: lilos://preview?reset=1&open=thread:t-chat-sidebar
- assertVisible: "Waiting for your OK"
- tapOn: "Approve plan"
- assertVisible: "Approved"
- extendedWaitUntil:
    visible: "The plan is carried out.*"
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 1500
- takeScreenshot: ${THEME}-15-thread-plan-carried-out

# Ask the CEO: the search tab, a search, then a question to the CEO.
- openLink: lilos://preview?reset=1&open=ask
- assertVisible: "Recent from the CEO"
- waitForAnimationToEnd:
    timeout: 1500
- takeScreenshot: ${THEME}-16-ask-ceo
- tapOn: "3 more"
- runFlow:
    file: scroll-proof.yaml
    env:
      NAME: ask
- tapOn: "Ask the CEO or search"
- inputText: "Scout"
- hideKeyboard
- waitForAnimationToEnd:
    timeout: 1500
- takeScreenshot: ${THEME}-17-ask-ceo-search
# The field is the capsule above the tab bar: tap it to type again.
- tapOn:
    point: "50%,94%"
- eraseText: 10
- inputText: "How many are working?"
- tapOn: "Ask the CEO: .*How many are working.*"
- extendedWaitUntil:
    visible: ".*agents are working.*"
    timeout: 60000
- waitForAnimationToEnd:
    timeout: 1500
- takeScreenshot: ${THEME}-18-ceo-thread

# Pulse: the bottom accessory opens the CEO's thread.
- openLink: lilos://preview?open=home
- tapOn: "Company pulse.*"
- assertVisible:
    id: thread-composer-input
- waitForAnimationToEnd:
    timeout: 1500
- takeScreenshot: ${THEME}-19-pulse-ceo-thread

# The v2 prototype is one link away. A link meant for v2 does not touch the
# v3 company (this push= would add a fourth ask), and a link back to v3
# carries its other params along (Needs opens once v3 has mounted).
- openLink: lilos://preview?reset=1&open=home
- openLink: lilos://preview?ui=v2&push=ask
- openLink: lilos://preview?ui=v3&open=needs
- assertVisible: "1 of 3"
- openLink: lilos://preview?ui=v2
- openLink: lilos://preview?ui=v3&open=work
- assertVisible: "Work"
