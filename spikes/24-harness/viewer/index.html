<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>LilOS Workbench — spike #24 viewer</title>
<link rel="stylesheet" href="/xterm/xterm.css">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header>
  <b>LilOS Workbench</b><span class="tag">spike #24</span>
  <span id="live" class="live">LIVE</span>
  <span id="pagemeta"></span>
  <span id="stats"></span>
</header>
<div id="previews"></div>
<main>
  <section id="browserpane">
    <div class="pane-title">Browser <span class="hint">click to focus, then type</span></div>
    <canvas id="screen" width="1280" height="800" tabindex="0"></canvas>
  </section>
  <aside>
    <section id="termpane">
      <div class="pane-title">Terminal <span class="hint">shared PTY — human & agent type in the same shell</span></div>
      <div id="term"></div>
    </section>
    <section id="feedpane">
      <div class="pane-title">Agent activity</div>
      <div id="feed"></div>
    </section>
  </aside>
</main>
<script src="/xterm/xterm.js"></script>
<script src="/xterm/addon-fit.js"></script>
<script src="/viewer.js"></script>
</body>
</html>
