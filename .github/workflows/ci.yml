name: CI

# Minutes budget (#201): the fast checks run on every PR push; the ~19-minute
# Playwright E2E runs only on main and on PRs that are ready for review and
# touch more than docs. The job is always named `verify` and always reports,
# so it can become a required check without hanging on "Expected".

on:
  push:
    branches: [main]
  pull_request:
    # ready_for_review: a draft skips E2E, so un-drafting must run it.
    types: [opened, synchronize, reopened, ready_for_review]

# A new push to a PR cancels that PR's older run; main runs every commit.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2 # on a PR merge commit, HEAD^1 is the base branch
      - name: Decide whether E2E runs
        id: scope
        env:
          EVENT: ${{ github.event_name }}
          DRAFT: ${{ github.event.pull_request.draft }}
          # Unit tests read these files, so the fast checks still run; E2E does not.
          DOCS_ONLY: '(\.md$|^\.agents/|^site/|^\.github/ISSUE_TEMPLATE/)'
        run: |
          e2e=true
          if [ "$EVENT" = pull_request ]; then
            if [ "$DRAFT" = true ]; then
              e2e=false
              echo "::notice title=E2E skipped::Draft PR: E2E runs once the PR is marked ready for review."
            elif ! git diff --name-only HEAD^1 HEAD | grep -qvE "$DOCS_ONLY"; then
              e2e=false
              echo "::notice title=E2E skipped::Only docs, skills or site files changed."
            fi
          fi
          echo "e2e=$e2e" >> "$GITHUB_OUTPUT"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Install Playwright browsers # unit tests drive real Chromium too
        run: bunx playwright install --with-deps chromium
      - name: Fast checks (biome, schema, typecheck, unit tests, prototype build)
        run: bun run verify:fast
      - name: Install Xvfb (Electron e2e display)
        if: steps.scope.outputs.e2e == 'true'
        run: sudo apt-get install -y xvfb
      - name: E2E
        if: steps.scope.outputs.e2e == 'true'
        run: xvfb-run -a bun run test:e2e
