name: CI

# Minutes budget (#201): the fast checks run on every PR push; the Playwright
# E2E runs only on main and on PRs that are ready for review and touch more
# than docs. E2E shards across 8 matrix legs on separate runners (#433 —
# workers on one runner starved every stack of CPU; #574 — Playwright shards
# by test count and can't split a serial spec file, so smaller legs are the
# only way to cut the dense ac-1xx block across legs), while `verify` stays
# the required check by aggregating the shards so it always reports.

on:
  push:
    branches: [main]
  pull_request:
    # ready_for_review: a draft skips E2E, so un-drafting must run it.
    types: [opened, synchronize, reopened, ready_for_review]

# #567: least privilege — every job only reads the checkout.
permissions:
  contents: read

# A new push to a PR cancels that PR's older run; main runs every commit.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  scope:
    runs-on: ubuntu-latest
    outputs:
      e2e: ${{ steps.scope.outputs.e2e }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2 # on a PR merge commit, HEAD^1 is the base branch
      - name: Decide whether E2E runs
        id: scope
        env:
          EVENT: ${{ github.event_name }}
          DRAFT: ${{ github.event.pull_request.draft }}
        run: |
          e2e=true
          if [ "$EVENT" = pull_request ]; then
            # Assigned first so a git failure fails the step instead of
            # silently skipping E2E; --no-renames keeps a moved file's old path.
            files=$(git diff --name-only --no-renames HEAD^1 HEAD)
            if [ "$DRAFT" = true ]; then
              e2e=false
              echo "::notice title=E2E skipped::Draft PR: E2E runs once the PR is marked ready for review."
            elif printf '%s\n' "$files" | sh scripts/ci/docs-only.sh; then
              e2e=false
              echo "::notice title=E2E skipped::Only docs, skills or site files changed."
            fi
          fi
          echo "e2e=$e2e" >> "$GITHUB_OUTPUT"

  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - name: Install dependencies
        run: bun install --frozen-lockfile
      # #567: fail on new high/critical advisories before burning the slow steps
      - name: Dependency audit
        run: bash scripts/ci/audit.sh
      - name: Install Playwright browsers # unit tests drive real Chromium too
        run: bunx playwright install --with-deps chromium
      - name: Fast checks (biome, schema, typecheck, unit tests, prototype build, mobile bundle check)
        run: bun run verify:fast

  e2e:
    needs: scope
    if: needs.scope.outputs.e2e == 'true'
    runs-on: ubuntu-latest
    strategy:
      # A failing leg still lets the others finish: the failure list stays complete.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Install Playwright browsers
        run: bunx playwright install --with-deps chromium
      # bun skips electron's postinstall, so the ~100 MB binary fetch
      # otherwise lands inside ac-71 AC-5 — mid-test, under whichever spec's
      # timing window runs on the other worker (#606 hit ac-544 AC-6 twice
      # this way in the ac-5xx/ac-71 leg). Fetch during setup instead;
      # install.js exits fast when dist/ is already present.
      - name: Fetch the Electron binary
        run: bun apps/desktop/node_modules/electron/install.js
      - name: Install Xvfb (Electron e2e display)
        run: sudo apt-get install -y xvfb
      - name: E2E shard ${{ matrix.shard }}/8
        run: xvfb-run -a bun run test:e2e --shard ${{ matrix.shard }}/8
      # #423/#508: the specs write their required screenshots under
      # test-results/ac-*/ — upload them so they can be committed to
      # pr-assets/<issue>/ (the repo can't be written from inside a run).
      - name: Upload ac screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ac-shots-${{ matrix.shard }}
          path: |
            test-results/ac-423/
            test-results/ac-508/
          if-no-files-found: ignore
          retention-days: 14
      # #504: the spec writes its required screenshots under
      # test-results/ac-504/ — upload them so they can be committed to
      # pr-assets/504/ (the repo can't be written from inside a run).
      - name: Upload ac-504 screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ac-504-shots-${{ matrix.shard }}
          path: test-results/ac-504/
          if-no-files-found: ignore
          retention-days: 14

  # #606 TEMP — flake-hunt leg: ac-544 AC-6 alone, 20 repeats, runs on draft
  # PRs (the main e2e legs skip drafts). Diagnostic only — deliberately not
  # in `verify`'s needs. Reverted before READY.
  e2e-606:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Install Playwright browsers
        run: bunx playwright install --with-deps chromium
      - name: ac-544 AC-6 x20
        run: bun run test:e2e e2e/ac-544-workbench-reopen.spec.ts -g "AC-6" --repeat-each 20

  verify:
    needs: [scope, checks, e2e]
    if: always() # reports on every path: draft, docs-only, failure, cancel
    runs-on: ubuntu-latest
    steps:
      - name: All required jobs green
        env:
          SCOPE: ${{ needs.scope.result }}
          CHECKS: ${{ needs.checks.result }}
          E2E: ${{ needs.e2e.result }}
        run: |
          echo "scope=$SCOPE checks=$CHECKS e2e=$E2E"
          # A failed scope job must not silently skip E2E; a skipped e2e
          # (draft / docs-only) is green; failure or cancelled is not.
          [ "$SCOPE" = success ] && [ "$CHECKS" = success ] &&
            { [ "$E2E" = success ] || [ "$E2E" = skipped ]; }
