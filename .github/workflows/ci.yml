name: CI

# Minutes budget (#201): the fast checks run on every PR push; the Playwright
# E2E runs only on main and on PRs that are ready for review and touch more
# than docs. E2E shards across 4 matrix legs on separate runners (#433 —
# 4 workers on one runner starved every stack of CPU, and 3 legs left both
# ~6-min spec files on one leg), while `verify` stays the required check by
# aggregating the shards so it always reports.

on:
  push:
    branches: [main]
  pull_request:
    # ready_for_review: a draft skips E2E, so un-drafting must run it.
    types: [opened, synchronize, reopened, ready_for_review]

# A new push to a PR cancels that PR's older run; main runs every commit.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  scope:
    runs-on: ubuntu-latest
    outputs:
      e2e: ${{ steps.scope.outputs.e2e }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2 # on a PR merge commit, HEAD^1 is the base branch
      - name: Decide whether E2E runs
        id: scope
        env:
          EVENT: ${{ github.event_name }}
          DRAFT: ${{ github.event.pull_request.draft }}
        run: |
          e2e=true
          if [ "$EVENT" = pull_request ]; then
            # Assigned first so a git failure fails the step instead of
            # silently skipping E2E; --no-renames keeps a moved file's old path.
            files=$(git diff --name-only --no-renames HEAD^1 HEAD)
            if [ "$DRAFT" = true ]; then
              e2e=false
              echo "::notice title=E2E skipped::Draft PR: E2E runs once the PR is marked ready for review."
            elif printf '%s\n' "$files" | sh scripts/ci/docs-only.sh; then
              e2e=false
              echo "::notice title=E2E skipped::Only docs, skills or site files changed."
            fi
          fi
          echo "e2e=$e2e" >> "$GITHUB_OUTPUT"

  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Install Playwright browsers # unit tests drive real Chromium too
        run: bunx playwright install --with-deps chromium
      - name: Fast checks (biome, schema, typecheck, unit tests, prototype build, mobile bundle check)
        run: bun run verify:fast

  e2e:
    needs: scope
    if: needs.scope.outputs.e2e == 'true'
    runs-on: ubuntu-latest
    strategy:
      # A failing leg still lets the others finish: the failure list stays complete.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Install Playwright browsers
        run: bunx playwright install --with-deps chromium
      - name: Install Xvfb (Electron e2e display)
        run: sudo apt-get install -y xvfb
      - name: E2E shard ${{ matrix.shard }}/4
        run: xvfb-run -a bun run test:e2e --shard ${{ matrix.shard }}/4
      # #423/#508: the specs write their required screenshots under
      # test-results/ac-*/ — upload them so they can be committed to
      # pr-assets/<issue>/ (the repo can't be written from inside a run).
      - name: Upload ac screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ac-shots-${{ matrix.shard }}
          path: |
            test-results/ac-423/
            test-results/ac-508/
          if-no-files-found: ignore
          retention-days: 14
      # #504: the spec writes its required screenshots under
      # test-results/ac-504/ — upload them so they can be committed to
      # pr-assets/504/ (the repo can't be written from inside a run).
      - name: Upload ac-504 screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ac-504-shots-${{ matrix.shard }}
          path: test-results/ac-504/
          if-no-files-found: ignore
          retention-days: 14

  # TEMP for #474: prove the ac-108 steer-leg flake is dead across 20
  # repeats under parallel load (the wild failure reproduced at ~1/30).
  # Not in verify's needs (the required check stays scope+checks+e2e).
  # REVERT this job — and only this job — once it reports green.
  e2e-474-repeat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Install Playwright browsers
        run: bunx playwright install --with-deps chromium
      - name: Install Xvfb (Electron e2e display)
        run: sudo apt-get install -y xvfb
      - name: ac-108 x20 (TEMP #474)
        run: xvfb-run -a bun run test:e2e e2e/ac-108-diff-comments.spec.ts --repeat-each 20 --workers=6

  verify:
    needs: [scope, checks, e2e]
    if: always() # reports on every path: draft, docs-only, failure, cancel
    runs-on: ubuntu-latest
    steps:
      - name: All required jobs green
        env:
          SCOPE: ${{ needs.scope.result }}
          CHECKS: ${{ needs.checks.result }}
          E2E: ${{ needs.e2e.result }}
        run: |
          echo "scope=$SCOPE checks=$CHECKS e2e=$E2E"
          # A failed scope job must not silently skip E2E; a skipped e2e
          # (draft / docs-only) is green; failure or cancelled is not.
          [ "$SCOPE" = success ] && [ "$CHECKS" = success ] &&
            { [ "$E2E" = success ] || [ "$E2E" = skipped ]; }
