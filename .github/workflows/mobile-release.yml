name: mobile-release

# Issue #250 AC-2 (optional): `git tag mobile-v*` ships a TestFlight build
# through EAS instead of `bun run mobile:release` on Oscar's Mac.
# needs-human before this works (documented in apps/mobile/README.md):
#   1) `bunx eas-cli login` + `bunx eas-cli init` in apps/mobile (one-time,
#      mints the EAS project id)
#   2) repo secret EXPO_TOKEN (an Expo access token from
#      https://expo.dev/settings/access-tokens)

on:
  push:
    tags: ["mobile-v*"]
  workflow_dispatch:

# #567: least privilege — the job only needs the checkout; the App Store /
# Expo submission goes through EXPO_TOKEN + ASC_*, not GITHUB_TOKEN.
permissions:
  contents: read

jobs:
  ios:
    runs-on: macos-latest
    steps:
      # #567: pinned to commit SHAs — this workflow holds signing secrets.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - run: bun install --frozen-lockfile

      - name: Stage ASC key for eas submit
        run: |
          printf '%s' "$ASC_KEY_P8" | sed 's/\\n/\n/g' > "$RUNNER_TEMP/AuthKey_$ASC_KEY_ID.p8"
          chmod 600 "$RUNNER_TEMP/AuthKey_$ASC_KEY_ID.p8"
          echo "ASC_KEY_FILE=$RUNNER_TEMP/AuthKey_$ASC_KEY_ID.p8" >> "$GITHUB_ENV"
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}

      - name: eas build + auto-submit (production profile)
        working-directory: apps/mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPO_ASC_API_KEY_PATH: ${{ env.ASC_KEY_FILE }}
          EXPO_ASC_API_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          EXPO_ASC_API_KEY_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: bunx eas-cli build -p ios --profile production --non-interactive --auto-submit
