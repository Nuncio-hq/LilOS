name: DCO

# Enforce Developer Certificate of Origin sign-off on every commit of a pull
# request (CONTRIBUTING.md). Well-known utility bots (dependabot,
# github-actions, release bots) are exempt; every other bot — including
# devin-ai-integration — must commit with `git commit -s`.

on:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: KineticCafe/actions-dco@5f160e3ee086af8fc0fb567b8add0937d074123e # v3.2.0
        with:
          config: |
            [bot]
            policy = "well-known"
